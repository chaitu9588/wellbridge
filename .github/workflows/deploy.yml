
name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/app
            git pull origin main
            sudo docker-compose -f week3/devops_day15/docker-compose.yml down
            sudo docker-compose -f week3/devops_day15/docker-compose.yml up -d --build

